# ============================================================
# PetConnect — Netlify Deployment Configuration
# ============================================================
# Frontend: Vite/React SPA  →  static site
# Backend:  Express API      →  Netlify Serverless Function
# ============================================================

[build]
  # Build the frontend (Vite) from the monorepo root
  command = "npm install && npm run build:netlify"
  # The directory Netlify publishes (Vite output)
  publish = "frontend/dist"
  # Where Netlify looks for serverless functions
  functions = "netlify/functions"

# ── Environment variables (defaults — override in Netlify UI) ──
[build.environment]
  NODE_VERSION = "20"

# ── Redirects ──────────────────────────────────────────────────
# 1. Proxy all /api/* requests to the serverless function
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200
  force  = true

# 2. SPA fallback — send all other routes to index.html
#    (React Router handles client-side routing)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Headers — Security & Performance ─────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options          = "DENY"
    X-Content-Type-Options   = "nosniff"
    Referrer-Policy          = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
